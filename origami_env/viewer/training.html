<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Origami RL — Training Grid</title>
<style>
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #fafafa;
  --bg-card: #ffffff;
  --border: #e5e7eb;
  --border-hover: #d1d5db;
  --text: #1a1a1a;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --accent: #3b82f6;
  --success: #16a34a;
  --error: #dc2626;
  --warning: #d97706;
  --surface: #f9fafb;
}

html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

/* ── Header ──────────────────────────────────────── */
.header {
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  z-index: 10;
  flex-shrink: 0;
}

.logo h1 {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.01em;
}

.logo h1 span { color: var(--accent); }

.header-stats {
  display: flex;
  align-items: center;
  gap: 20px;
}

.stat {
  font-size: 12px;
  color: var(--text-muted);
}

.stat .val {
  font-weight: 600;
  color: var(--text);
  margin-left: 4px;
  font-variant-numeric: tabular-nums;
}

.conn-indicator {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-muted);
}

.conn-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #d1d5db;
  transition: background 0.3s;
}

.conn-dot.connected { background: var(--success); }
.conn-dot.disconnected { background: var(--error); }
.conn-dot.waiting { background: var(--warning); }

/* ── Main Layout (grid view vs detail view) ──────── */
.main-area {
  height: calc(100vh - 52px);
  position: relative;
}

/* ── Grid Container ──────────────────────────────── */
.grid-container {
  height: 100%;
  padding: 16px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  grid-auto-rows: minmax(280px, 1fr);
  gap: 12px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: #d1d5db transparent;
}

.grid-container::-webkit-scrollbar { width: 5px; }
.grid-container::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

.grid-container.hidden { display: none; }

/* ── Episode Card ────────────────────────────────── */
.ep-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  transition: border-color 0.2s, box-shadow 0.2s;
  animation: fadeIn 0.3s ease both;
}

.ep-card:hover {
  border-color: var(--border-hover);
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}

/* Status top-border */
.ep-card.running { border-top: 2px solid var(--accent); }
.ep-card.success { border-top: 2px solid var(--success); }
.ep-card.error   { border-top: 2px solid var(--error); }
.ep-card.timeout { border-top: 2px solid var(--warning); }

/* Best episode: thicker green border instead of badge */
.ep-card.best-episode {
  border: 2px solid var(--success);
  box-shadow: 0 0 0 1px var(--success), 0 2px 16px rgba(22,163,106,0.08);
}

/* Card header */
.ep-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
}

.ep-id-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
}

.ep-status-tag {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 4px;
}

.ep-status-tag.running { color: var(--accent); background: rgba(59,130,246,0.08); }
.ep-status-tag.success { color: var(--success); background: rgba(22,163,106,0.08); }
.ep-status-tag.error   { color: var(--error); background: rgba(220,38,38,0.08); }
.ep-status-tag.timeout { color: var(--warning); background: rgba(217,119,6,0.08); }

/* 3D canvas area */
.ep-viewport {
  flex: 1;
  position: relative;
  min-height: 0;
  background: var(--surface);
}

.ep-viewport canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* Card footer with metrics */
.ep-metrics-bar {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 6px 12px;
  border-top: 1px solid var(--border);
  min-height: 32px;
}

.ep-metric {
  display: flex;
  align-items: baseline;
  gap: 4px;
  padding-right: 10px;
  border-right: 1px solid var(--border);
  font-size: 11px;
}

.ep-metric:last-child { border-right: none; padding-right: 0; }

.ep-metric .k {
  color: var(--text-muted);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.ep-metric .v {
  font-weight: 600;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

.ep-metric .v.pos { color: var(--success); }
.ep-metric .v.neg { color: var(--error); }

/* ── Empty State ─────────────────────────────────── */
.empty-state {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  flex-direction: column;
  gap: 12px;
  animation: fadeIn 0.5s ease;
}

.empty-state .msg {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-secondary);
}

.empty-state .sub {
  font-size: 13px;
  color: var(--text-muted);
}

/* ── Detail View (replaces fullscreen overlay) ───── */
.detail-view {
  display: none;
  height: 100%;
  flex-direction: column;
}

.detail-view.active {
  display: flex;
}

.detail-topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 24px;
  height: 48px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.detail-topbar h2 {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

.detail-topbar h2 .ep-highlight {
  color: var(--accent);
}

.back-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 5px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  transition: color 0.15s, border-color 0.15s;
}

.back-btn:hover {
  color: var(--text);
  border-color: var(--border-hover);
}

.detail-body {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  min-height: 0;
  background: var(--border);
}

.detail-panel {
  position: relative;
  background: var(--bg-card);
  overflow: hidden;
}

.detail-panel-label {
  position: absolute;
  top: 10px;
  left: 16px;
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  z-index: 2;
  pointer-events: none;
}

.detail-panel canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.detail-dashboard {
  display: flex;
  align-items: stretch;
  gap: 1px;
  background: var(--border);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  min-height: 60px;
}

.detail-metric-cell {
  flex: 1;
  background: var(--bg-card);
  padding: 8px 14px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.detail-metric-cell .label {
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  margin-bottom: 2px;
}

.detail-metric-cell .value {
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}

.detail-metric-cell .value.pos { color: var(--success); }
.detail-metric-cell .value.neg { color: var(--error); }

/* Fold legend in crease panel */
.fold-legend {
  position: absolute;
  bottom: 10px;
  left: 16px;
  display: flex;
  gap: 14px;
  font-size: 11px;
  color: var(--text-muted);
  z-index: 2;
  pointer-events: none;
}

.fold-legend .swatch {
  display: inline-block;
  width: 14px;
  height: 2px;
  margin-right: 4px;
  vertical-align: middle;
}

.fold-legend .swatch.mountain { background: var(--error); }
.fold-legend .swatch.valley   { background: var(--accent); }
.fold-legend .swatch.boundary { background: var(--text-secondary); }

/* ── Responsive ──────────────────────────────────── */
@media (max-width: 720px) {
  .header { padding: 0 12px; }
  .header-stats { gap: 12px; }
  .grid-container { padding: 8px; gap: 8px; grid-template-columns: 1fr 1fr; }
  .detail-body { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">
    <h1>Origami <span>RL</span> Training</h1>
  </div>
  <div class="header-stats">
    <div class="stat">Batch<span class="val" id="batch-id">&mdash;</span></div>
    <div class="stat">Episodes<span class="val" id="ep-count">0</span></div>
    <div class="stat">Avg<span class="val" id="avg-score">&mdash;</span></div>
    <div class="conn-indicator">
      <span class="conn-dot disconnected" id="conn-dot"></span>
      <span id="conn-label">Offline</span>
    </div>
  </div>
</div>

<!-- Main Area -->
<div class="main-area">

  <!-- Grid View -->
  <div class="grid-container" id="grid"></div>

  <!-- Empty state -->
  <div class="empty-state" id="empty-state">
    <div class="msg">Awaiting Training</div>
    <div class="sub">Episodes will appear here when a batch starts</div>
  </div>

  <!-- Detail View (replaces fullscreen overlay) -->
  <div class="detail-view" id="detail-view">
    <div class="detail-topbar">
      <h2 id="detail-title">Episode <span class="ep-highlight">&mdash;</span></h2>
      <button class="back-btn" id="back-btn">
        <span>&larr;</span> Back to Grid
      </button>
    </div>
    <div class="detail-body">
      <div class="detail-panel" id="detail-crease-panel">
        <div class="detail-panel-label">Crease Pattern</div>
        <canvas id="detail-crease-canvas"></canvas>
        <div class="fold-legend">
          <span><span class="swatch mountain"></span>Mountain</span>
          <span><span class="swatch valley"></span>Valley</span>
          <span><span class="swatch boundary"></span>Boundary</span>
        </div>
      </div>
      <div class="detail-panel" id="detail-three-panel">
        <div class="detail-panel-label">3D Folded State</div>
        <canvas id="detail-three-canvas"></canvas>
      </div>
    </div>
    <div class="detail-dashboard" id="detail-dashboard"></div>
  </div>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── State ──────────────────────────────────────────────────
const episodes = {};
let detailEpId = null;
let cardIndex = 0;

// ── Color constants ────────────────────────────────────────
const C = {
  bgScene: 0xf5f5f5,
  mountain: '#dc2626',
  valley: '#3b82f6',
  boundary: '#374151',
  mutedEdge: '#d1d5db',
  success: '#16a34a',
  error: '#dc2626',
};

const EDGE_COLORS_2D = { M: C.mountain, V: C.valley, B: C.boundary, F: C.mutedEdge, U: C.mutedEdge };

// ── Detail view dedicated Three.js scene ────────────────────
const detailThreeCanvas = document.getElementById('detail-three-canvas');
const detailRenderer = new THREE.WebGLRenderer({ canvas: detailThreeCanvas, antialias: true });
detailRenderer.setPixelRatio(window.devicePixelRatio);
const detailScene = new THREE.Scene();
detailScene.background = new THREE.Color(C.bgScene);
const detailCamera = new THREE.PerspectiveCamera(50, 1, 0.01, 100);
detailCamera.position.set(0.5, 1.5, 2.0);
detailScene.add(new THREE.AmbientLight(0xffffff, 0.6));
const detailDirLight = new THREE.DirectionalLight(0xffffff, 0.8);
detailDirLight.position.set(2, 3, 2);
detailScene.add(detailDirLight);
const detailFillLight = new THREE.DirectionalLight(0xeef2ff, 0.3);
detailFillLight.position.set(-2, 1, -1);
detailScene.add(detailFillLight);
const detailMeshGroup = new THREE.Group();
detailScene.add(detailMeshGroup);
const detailControls = new OrbitControls(detailCamera, detailThreeCanvas);
detailControls.target.set(0.5, 0.5, 0);
detailControls.enableDamping = true;
detailControls.dampingFactor = 0.08;

const detailCreaseCanvas = document.getElementById('detail-crease-canvas');
const detailCtx = detailCreaseCanvas.getContext('2d');

// ── Mini renderer factory ──────────────────────────────────
function createMiniRenderer(canvas) {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(C.bgScene);
  const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 100);
  camera.position.set(0.5, 1.2, 1.8);
  camera.lookAt(0.5, 0.0, -0.5);
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dl = new THREE.DirectionalLight(0xffffff, 0.7);
  dl.position.set(2, 3, 2);
  scene.add(dl);
  const meshGroup = new THREE.Group();
  scene.add(meshGroup);
  return { renderer, scene, camera, meshGroup };
}

// ── Mesh builder ───────────────────────────────────────────
function buildMesh(ps, meshGroup) {
  while (meshGroup.children.length) {
    const c = meshGroup.children[0];
    if (c.geometry) c.geometry.dispose();
    if (c.material) c.material.dispose();
    meshGroup.remove(c);
  }
  if (!ps || !ps.vertices_coords || ps.vertices_coords.length === 0) return;

  const verts = ps.vertices_coords;
  const faces = ps.faces_vertices || [];
  const strain = ps.strain_per_vertex || new Array(verts.length).fill(0);
  const edges = ps.edges_vertices || [];
  const assignments = ps.edges_assignment || [];

  // Use triangulated_faces from server if available, otherwise fan-triangulate
  let indices;
  if (ps.triangulated_faces && ps.triangulated_faces.length > 0) {
    indices = ps.triangulated_faces.flat();
  } else {
    indices = [];
    for (const face of faces) {
      for (let i = 1; i < face.length - 1; i++) {
        indices.push(face[0], face[i], face[i + 1]);
      }
    }
  }

  // Positions (swap Y/Z for Three.js Y-up)
  const positions = new Float32Array(verts.length * 3);
  for (let i = 0; i < verts.length; i++) {
    positions[i * 3]     = verts[i][0];
    positions[i * 3 + 1] = verts[i][2] || 0;
    positions[i * 3 + 2] = -(verts[i][1] || 0);
  }

  // Strain -> color (light blue-gray -> red for high strain)
  const maxStrain = Math.max(...strain, 0.0001);
  const colors = new Float32Array(verts.length * 3);
  for (let i = 0; i < verts.length; i++) {
    const t = Math.min(strain[i] / maxStrain, 1.0);
    colors[i * 3]     = 0.85 + 0.15 * t;
    colors[i * 3 + 1] = 0.88 - 0.52 * t;
    colors[i * 3 + 2] = 0.95 - 0.82 * t;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  if (indices.length > 0) geo.setIndex(indices);
  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    vertexColors: true,
    side: THREE.DoubleSide,
    roughness: 0.65,
    metalness: 0.05,
  });
  meshGroup.add(new THREE.Mesh(geo, mat));

  // Crease edges
  const edgeHex = { M: 0xdc2626, V: 0x3b82f6, B: 0x6b7280 };
  for (let i = 0; i < edges.length; i++) {
    const asgn = assignments[i];
    if (!(asgn in edgeHex)) continue;
    const [v1, v2] = edges[i];
    const pts = [
      new THREE.Vector3(verts[v1][0], verts[v1][2] || 0, -(verts[v1][1] || 0)),
      new THREE.Vector3(verts[v2][0], verts[v2][2] || 0, -(verts[v2][1] || 0)),
    ];
    const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
    const lineMat = new THREE.LineBasicMaterial({ color: edgeHex[asgn] });
    meshGroup.add(new THREE.Line(lineGeo, lineMat));
  }
}

// ── 2D crease pattern ──────────────────────────────────────
function drawCrease(ctx, canvas, ps) {
  if (!ps || !ps.vertices_coords) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;
  ctx.scale(dpr, dpr);
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  ctx.clearRect(0, 0, cw, ch);

  // Light background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, cw, ch);

  // Use rest_positions for 2D if available
  const verts = ps.rest_positions || ps.vertices_coords;
  const sheetW = ps.width || 1, sheetH = ps.height || 1;
  const margin = 40;
  const scale = Math.min((cw - 2 * margin) / sheetW, (ch - 2 * margin) / sheetH);
  const ox = (cw - sheetW * scale) / 2, oy = (ch - sheetH * scale) / 2;
  const tx = v => ox + v[0] * scale;
  const ty = v => oy + (sheetH - v[1]) * scale;

  const edges = ps.edges_vertices || [];
  const asgns = ps.edges_assignment || [];

  // Draw in order: F/U -> V -> M -> B (B on top)
  for (const layer of ['F', 'U', 'V', 'M', 'B']) {
    for (let i = 0; i < edges.length; i++) {
      if ((asgns[i] || 'U') !== layer) continue;
      const [v1, v2] = edges[i];
      if (!verts[v1] || !verts[v2]) continue;
      ctx.beginPath();
      ctx.moveTo(tx(verts[v1]), ty(verts[v1]));
      ctx.lineTo(tx(verts[v2]), ty(verts[v2]));
      ctx.strokeStyle = EDGE_COLORS_2D[layer] || C.mutedEdge;

      if (layer === 'B') {
        ctx.lineWidth = 2;
        ctx.setLineDash([]);
      } else if (layer === 'M') {
        ctx.lineWidth = 1.5;
        ctx.setLineDash([6, 2, 2, 2]);
      } else if (layer === 'V') {
        ctx.lineWidth = 1.5;
        ctx.setLineDash([5, 3]);
      } else {
        ctx.lineWidth = 0.6;
        ctx.setLineDash([]);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // Vertices as small dots
  ctx.fillStyle = '#d1d5db';
  for (const v of verts) {
    if (!v) continue;
    ctx.beginPath();
    ctx.arc(tx(v), ty(v), 1.5, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

// ── Detail view metrics dashboard ──────────────────────────
function renderDashboard(container, obs) {
  const m = obs.metrics || {};
  const cells = [
    { label: 'Compactness', value: (m.compactness || 0).toFixed(3), cls: m.compactness > 0.5 ? 'pos' : '' },
    { label: 'Strain', value: (m.max_strain || 0).toFixed(5), cls: m.strain_exceeded ? 'neg' : '' },
    { label: 'Folds', value: m.fold_count || 0, cls: '' },
    { label: 'Valid', value: m.is_valid ? 'YES' : 'NO', cls: m.is_valid ? 'pos' : 'neg' },
    { label: 'Kawasaki', value: m.kawasaki_violations || 0, cls: m.kawasaki_violations > 0 ? 'neg' : 'pos' },
    { label: 'Maekawa', value: m.maekawa_violations || 0, cls: m.maekawa_violations > 0 ? 'neg' : 'pos' },
    { label: 'Energy', value: (m.total_energy || 0).toFixed(3), cls: '' },
  ];
  if (obs.done && obs.reward != null) {
    cells.push({ label: 'Reward', value: Number(obs.reward).toFixed(2), cls: obs.reward > 0 ? 'pos' : 'neg' });
  }
  container.innerHTML = cells.map(c =>
    `<div class="detail-metric-cell">
       <div class="label">${c.label}</div>
       <div class="value ${c.cls}">${c.value}</div>
     </div>`
  ).join('');
}

// ── Card CRUD ──────────────────────────────────────────────
function getOrCreateCard(epId) {
  if (episodes[epId] && episodes[epId].card) return episodes[epId];

  const grid = document.getElementById('grid');
  document.getElementById('empty-state').style.display = 'none';

  const idx = cardIndex++;
  const card = document.createElement('div');
  card.className = 'ep-card running';
  card.dataset.epId = epId;
  card.style.animationDelay = `${idx * 0.05}s`;
  card.innerHTML = `
    <div class="ep-head">
      <span class="ep-id-label">${epId}</span>
      <span class="ep-status-tag running">Running</span>
    </div>
    <div class="ep-viewport"><canvas></canvas></div>
    <div class="ep-metrics-bar"></div>
  `;
  grid.appendChild(card);

  const canvas = card.querySelector('.ep-viewport canvas');
  const mini = createMiniRenderer(canvas);

  card.addEventListener('click', () => openDetail(epId));

  const ep = {
    card, ...mini,
    status: 'running', step: 0, score: null,
    observation: {}, metrics: {},
  };
  episodes[epId] = ep;

  requestAnimationFrame(() => {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (w > 0 && h > 0) {
      mini.renderer.setSize(w, h, false);
      mini.camera.aspect = w / h;
      mini.camera.updateProjectionMatrix();
    }
  });

  return ep;
}

function updateCard(epId, obs, status, step, score) {
  const ep = getOrCreateCard(epId);
  ep.status = status || ep.status;
  ep.step = step != null ? step : ep.step;
  if (score != null) ep.score = score;
  if (obs) {
    ep.observation = obs;
    ep.metrics = obs.metrics || {};
  }

  // Card class
  ep.card.className = `ep-card ${ep.status}`;

  // Status tag
  const tag = ep.card.querySelector('.ep-status-tag');
  tag.className = `ep-status-tag ${ep.status}`;
  const labels = { running: 'Running', success: 'Complete', error: 'Error', timeout: 'Timeout' };
  tag.textContent = labels[ep.status] || ep.status;

  // Metrics bar
  const bar = ep.card.querySelector('.ep-metrics-bar');
  const m = ep.metrics;
  let html = `
    <div class="ep-metric"><span class="k">Step</span> <span class="v">${ep.step}</span></div>
    <div class="ep-metric"><span class="k">C</span> <span class="v ${(m.compactness||0)>0.5?'pos':''}">${(m.compactness||0).toFixed(2)}</span></div>
    <div class="ep-metric"><span class="k">Valid</span> <span class="v ${m.is_valid?'pos':'neg'}">${m.is_valid?'Y':'N'}</span></div>
  `;
  if (ep.score != null) {
    html += `<div class="ep-metric"><span class="k">R</span> <span class="v ${ep.score>0?'pos':'neg'}">${ep.score.toFixed(1)}</span></div>`;
  }
  bar.innerHTML = html;

  // 3D mesh
  const ps = obs ? obs.paper_state : null;
  if (ps) {
    buildMesh(ps, ep.meshGroup);
    const canvas = ep.card.querySelector('.ep-viewport canvas');
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (w > 0 && h > 0) {
      ep.renderer.setSize(w, h, false);
      ep.camera.aspect = w / h;
      ep.camera.updateProjectionMatrix();
      ep.renderer.render(ep.scene, ep.camera);
    }
  }

  // Sync detail view if open
  if (detailEpId === epId && obs) {
    updateDetailView(epId);
  }

  // Header count
  document.getElementById('ep-count').textContent = Object.keys(episodes).length;
}

function clearGrid() {
  const grid = document.getElementById('grid');
  for (const ep of Object.values(episodes)) {
    if (ep.renderer) ep.renderer.dispose();
  }
  for (const key of Object.keys(episodes)) delete episodes[key];
  grid.innerHTML = '';
  cardIndex = 0;
}

// ── Detail View (SPA-style show/hide) ──────────────────────
function openDetail(epId) {
  const ep = episodes[epId];
  if (!ep) return;
  detailEpId = epId;

  // Hide grid, show detail
  document.getElementById('grid').classList.add('hidden');
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('detail-view').classList.add('active');

  document.getElementById('detail-title').innerHTML =
    `Episode <span class="ep-highlight">${epId}</span>`;
  updateDetailView(epId);
}

function closeDetail() {
  detailEpId = null;
  document.getElementById('detail-view').classList.remove('active');
  document.getElementById('grid').classList.remove('hidden');
}

function updateDetailView(epId) {
  const ep = episodes[epId];
  if (!ep || !ep.observation) return;

  const obs = ep.observation;
  const ps = obs.paper_state;

  // 3D
  buildMesh(ps, detailMeshGroup);
  const threePnl = document.getElementById('detail-three-panel');
  detailRenderer.setSize(threePnl.clientWidth, threePnl.clientHeight, false);
  detailCamera.aspect = threePnl.clientWidth / threePnl.clientHeight;
  detailCamera.updateProjectionMatrix();
  detailRenderer.render(detailScene, detailCamera);

  // 2D
  drawCrease(detailCtx, detailCreaseCanvas, ps);

  // Dashboard
  renderDashboard(document.getElementById('detail-dashboard'), obs);

  // Title
  let titleHtml = `Episode <span class="ep-highlight">${epId}</span>`;
  if (ep.score != null) {
    const cls = ep.score > 0 ? 'pos' : 'neg';
    const color = ep.score > 0 ? 'var(--success)' : 'var(--error)';
    titleHtml += ` &mdash; <span style="color:${color}">${ep.score.toFixed(2)}</span>`;
  }
  document.getElementById('detail-title').innerHTML = titleHtml;
}

document.getElementById('back-btn').addEventListener('click', closeDetail);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

// ── Animation loop ─────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);

  for (const ep of Object.values(episodes)) {
    if (ep.renderer && ep.card && ep.card.offsetParent !== null) {
      const canvas = ep.card.querySelector('.ep-viewport canvas');
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if (w > 0 && h > 0) {
        ep.renderer.setSize(w, h, false);
        ep.camera.aspect = w / h;
        ep.camera.updateProjectionMatrix();
        ep.renderer.render(ep.scene, ep.camera);
      }
    }
  }

  if (detailEpId) {
    detailControls.update();
    detailRenderer.render(detailScene, detailCamera);
  }
}
animate();

// ── WebSocket ──────────────────────────────────────────────
let ws = null;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${proto}//${location.host}/ws/training`;
  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    document.getElementById('conn-dot').className = 'conn-dot connected';
    document.getElementById('conn-label').textContent = 'Live';
  };

  ws.onclose = () => {
    document.getElementById('conn-dot').className = 'conn-dot disconnected';
    document.getElementById('conn-label').textContent = 'Offline';
    setTimeout(connect, 2000);
  };

  ws.onerror = () => {
    document.getElementById('conn-dot').className = 'conn-dot disconnected';
    document.getElementById('conn-label').textContent = 'Error';
  };

  ws.onmessage = (evt) => {
    try {
      handleMessage(JSON.parse(evt.data));
    } catch (e) {
      console.error('WS parse error:', e);
    }
  };
}

function handleMessage(msg) {
  switch (msg.type) {
    case 'registry':
      document.getElementById('batch-id').textContent = msg.batch_id || '\u2014';
      if (msg.episodes) {
        for (const [epId, ep] of Object.entries(msg.episodes)) {
          updateCard(epId, ep.observation, ep.status, ep.step, ep.score);
        }
      }
      if (!msg.episodes || Object.keys(msg.episodes).length === 0) {
        document.getElementById('empty-state').style.display = 'flex';
      }
      break;

    case 'training_start':
      document.getElementById('conn-dot').className = 'conn-dot connected';
      document.getElementById('conn-label').textContent = 'Training';
      break;

    case 'batch_start':
      clearGrid();
      document.getElementById('batch-id').textContent = msg.batch_id;
      document.getElementById('avg-score').textContent = '\u2014';
      document.getElementById('empty-state').style.display = 'none';
      break;

    case 'episode_reset':
      updateCard(msg.episode_id, msg.observation, 'running', 0, null);
      break;

    case 'episode_update':
      updateCard(msg.episode_id, msg.observation, 'running', msg.step, null);
      break;

    case 'episode_done':
      updateCard(msg.episode_id, null, msg.status, null, msg.score);
      break;

    case 'batch_done':
      document.getElementById('avg-score').textContent =
        msg.avg_score != null ? msg.avg_score.toFixed(2) : '\u2014';
      if (msg.best_episode_id && episodes[msg.best_episode_id]) {
        episodes[msg.best_episode_id].card.classList.add('best-episode');
      }
      break;

    case 'training_done':
      document.getElementById('conn-dot').className = 'conn-dot waiting';
      document.getElementById('conn-label').textContent = 'Done';
      break;
  }
}

// ── Window resize ──────────────────────────────────────────
window.addEventListener('resize', () => {
  if (detailEpId) updateDetailView(detailEpId);
});

// ── Init ───────────────────────────────────────────────────
connect();
</script>
