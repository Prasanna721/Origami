<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Origami RL — Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: #fafafa;
  color: #1a1a1a;
  line-height: 1.5;
}

.app {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto auto 1fr auto;
  height: 100vh;
  gap: 0;
}

/* ── Header ──────────────────────────────────────── */
header {
  grid-column: 1 / -1;
  background: #ffffff;
  border-bottom: 1px solid #e5e7eb;
  padding: 0 24px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

header h1 {
  font-size: 15px;
  font-weight: 600;
  color: #1a1a1a;
  letter-spacing: -0.01em;
}

header h1 span {
  color: #3b82f6;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.status-badge {
  font-size: 12px;
  color: #9ca3af;
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #d1d5db;
  transition: background 0.3s;
}

.status-dot.connected { background: #22c55e; }

/* ── Error bar ───────────────────────────────────── */
#error-bar {
  grid-column: 1 / -1;
  background: #fef2f2;
  border-bottom: 1px solid #fecaca;
  color: #dc2626;
  padding: 8px 24px;
  font-size: 13px;
  display: none;
}

#error-bar.success {
  background: #f0fdf4;
  border-bottom-color: #bbf7d0;
  color: #16a34a;
}

/* ── Panels ──────────────────────────────────────── */
.panel {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-top: none;
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.panel:first-of-type { border-right: none; }

.panel-title {
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #9ca3af;
  padding: 10px 16px;
  border-bottom: 1px solid #f3f4f6;
  flex-shrink: 0;
}

#crease-canvas {
  flex: 1;
  width: 100%;
  display: block;
}

#three-container {
  flex: 1;
  width: 100%;
}

/* ── Controls ────────────────────────────────────── */
.controls-bar {
  grid-column: 1 / -1;
  background: #ffffff;
  border-top: 1px solid #e5e7eb;
  padding: 12px 24px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}

.control-group {
  display: flex;
  align-items: center;
  gap: 6px;
}

.control-group label {
  font-size: 11px;
  font-weight: 500;
  color: #6b7280;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  white-space: nowrap;
}

.control-group select,
.control-group input[type="number"] {
  background: #ffffff;
  border: 1px solid #d1d5db;
  color: #1a1a1a;
  padding: 5px 8px;
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s;
}

.control-group select:focus,
.control-group input:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
}

.control-group input[type="number"] { width: 60px; }

.control-group input[type="range"] {
  width: 100px;
  accent-color: #3b82f6;
}

.control-group .range-val {
  font-size: 12px;
  font-weight: 500;
  color: #374151;
  min-width: 32px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.spacer { flex: 1; }

button {
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
  border: none;
}

button.primary {
  background: #3b82f6;
  color: #ffffff;
}
button.primary:hover { background: #2563eb; }

button.secondary {
  background: #ffffff;
  color: #374151;
  border: 1px solid #d1d5db;
}
button.secondary:hover { background: #f9fafb; border-color: #9ca3af; }

button.ghost {
  background: transparent;
  color: #6b7280;
  border: 1px solid #e5e7eb;
}
button.ghost:hover { background: #f3f4f6; color: #374151; }

/* ── File loading ────────────────────────────────── */
.file-input { display: none; }

/* ── Examples dropdown ───────────────────────────── */
.examples-wrapper {
  position: relative;
}

.examples-dropdown {
  position: absolute;
  bottom: 100%;
  left: 0;
  margin-bottom: 4px;
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  min-width: 200px;
  max-height: 240px;
  overflow-y: auto;
  display: none;
  z-index: 20;
}

.examples-dropdown.open { display: block; }

.examples-dropdown .example-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 8px 14px;
  font-size: 13px;
  color: #374151;
  background: none;
  border: none;
  border-radius: 0;
  cursor: pointer;
  border-bottom: 1px solid #f3f4f6;
}

.examples-dropdown .example-item:last-child { border-bottom: none; }
.examples-dropdown .example-item:hover { background: #f3f4f6; color: #3b82f6; }

.examples-dropdown .empty-msg {
  padding: 12px 14px;
  font-size: 12px;
  color: #9ca3af;
}

/* ── Metrics ─────────────────────────────────────── */
.metrics-bar {
  grid-column: 1 / -1;
  background: #ffffff;
  border-top: 1px solid #e5e7eb;
  padding: 10px 24px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.metric-card {
  background: #f9fafb;
  border: 1px solid #f3f4f6;
  border-radius: 6px;
  padding: 6px 12px;
  min-width: 100px;
}

.metric-card .label {
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: #9ca3af;
}

.metric-card .value {
  font-size: 16px;
  font-weight: 600;
  color: #1a1a1a;
  margin-top: 1px;
  font-variant-numeric: tabular-nums;
}

.metric-card .value.good { color: #16a34a; }
.metric-card .value.bad { color: #dc2626; }
.metric-card .value.warn { color: #d97706; }

/* ── Responsive ──────────────────────────────────── */
@media (max-width: 768px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto 300px 300px auto auto; }
  .panel:first-of-type { border-right: 1px solid #e5e7eb; }
  .controls-bar { padding: 10px 12px; gap: 8px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Origami <span>RL</span></h1>
    <div class="header-right">
      <div class="status-badge">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-label">Disconnected</span>
      </div>
    </div>
  </header>

  <div id="error-bar"></div>

  <div class="panel" id="crease-panel">
    <div class="panel-title">Crease Pattern (2D)</div>
    <canvas id="crease-canvas"></canvas>
  </div>

  <div class="panel" id="three-panel">
    <div class="panel-title">Folded State (3D)</div>
    <div id="three-container"></div>
  </div>

  <div class="controls-bar">
    <div class="control-group">
      <label>Task</label>
      <select id="task-select">
        <option value="half_fold">half_fold</option>
        <option value="quarter_fold">quarter_fold</option>
        <option value="letter_fold">letter_fold</option>
        <option value="map_fold">map_fold</option>
        <option value="solar_panel">solar_panel</option>
        <option value="shelter_wall">shelter_wall</option>
        <option value="stent">stent</option>
      </select>
    </div>

    <button class="primary" id="btn-reset">Reset</button>

    <div class="control-group">
      <label>Fold %</label>
      <input type="range" id="fold-pct" min="0" max="100" value="100">
      <span class="range-val" id="fold-pct-val">100%</span>
    </div>

    <div class="spacer"></div>

    <div class="control-group examples-wrapper">
      <button class="ghost" id="btn-examples">Examples</button>
      <div class="examples-dropdown" id="examples-dropdown"></div>
    </div>

    <input type="file" id="file-svg" accept=".svg" class="file-input">
    <input type="file" id="file-fold" accept=".fold,.json" class="file-input">
    <button class="ghost" id="btn-load-svg">Load SVG</button>
    <button class="ghost" id="btn-load-fold">Load FOLD</button>

    <div class="spacer"></div>

    <div class="control-group">
      <label>Type</label>
      <select id="fold-type">
        <option value="valley">Valley</option>
        <option value="mountain">Mountain</option>
      </select>
    </div>

    <div class="control-group">
      <label>X1</label><input id="lx1" type="number" value="0" min="0" max="1" step="0.1">
      <label>Y1</label><input id="ly1" type="number" value="0.5" min="0" max="1" step="0.1">
      <label>X2</label><input id="lx2" type="number" value="1" min="0" max="1" step="0.1">
      <label>Y2</label><input id="ly2" type="number" value="0.5" min="0" max="1" step="0.1">
    </div>

    <div class="control-group">
      <label>Angle</label>
      <input id="fold-angle" type="number" value="180" min="0" max="180" step="10">
    </div>

    <button class="primary" id="btn-step">Fold</button>
    <button class="secondary" id="btn-stop">Stop</button>
  </div>

  <div class="metrics-bar" id="metrics-bar"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── State ──────────────────────────────────────────────────
let ws = null;
let currentObs = null;

// ── Three.js setup ─────────────────────────────────────────
const container = document.getElementById('three-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfafafa);

const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 100);
camera.position.set(0.5, 1.5, 2.0);

const renderer3d = new THREE.WebGLRenderer({ antialias: true });
container.appendChild(renderer3d.domElement);

const controls = new OrbitControls(camera, renderer3d.domElement);
controls.target.set(0.5, 0.5, 0);
controls.enableDamping = true;

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(2, 3, 2);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0xeef2ff, 0.3);
fillLight.position.set(-2, 1, -1);
scene.add(fillLight);

// Mesh group
let meshGroup = new THREE.Group();
scene.add(meshGroup);

function resizeThree() {
  const w = container.clientWidth;
  const h = container.clientHeight;
  if (w === 0 || h === 0) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer3d.setSize(w, h);
  renderer3d.setPixelRatio(window.devicePixelRatio);
}
window.addEventListener('resize', resizeThree);
setTimeout(resizeThree, 100);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer3d.render(scene, camera);
}
animate();

// ── 2D Crease Canvas ───────────────────────────────────────
const creaseCanvas = document.getElementById('crease-canvas');
const ctx = creaseCanvas.getContext('2d');

function resizeCrease() {
  const panel = document.getElementById('crease-panel');
  const dpr = window.devicePixelRatio || 1;
  const w = panel.clientWidth;
  const h = panel.clientHeight - 36;
  creaseCanvas.width = w * dpr;
  creaseCanvas.height = h * dpr;
  creaseCanvas.style.width = w + 'px';
  creaseCanvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (currentObs) drawCreasePattern(currentObs.paper_state);
}
window.addEventListener('resize', resizeCrease);
setTimeout(resizeCrease, 100);

const EDGE_COLORS = { M: '#dc2626', V: '#3b82f6', B: '#374151', F: '#d1d5db', U: '#d1d5db' };
const EDGE_WIDTHS = { M: 2, V: 2, B: 2.5, F: 0.5, U: 0.8 };

function drawCreasePattern(ps) {
  if (!ps || !ps.vertices_coords) return;
  const w = creaseCanvas.width / (window.devicePixelRatio || 1);
  const h = creaseCanvas.height / (window.devicePixelRatio || 1);
  ctx.clearRect(0, 0, w, h);

  // Light background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);

  // Use rest_positions for 2D rendering if available, otherwise vertices_coords
  const coords2d = ps.rest_positions || ps.vertices_coords;
  const sheetW = ps.width || 1;
  const sheetH = ps.height || 1;
  const margin = 40;
  const scale = Math.min((w - 2 * margin) / sheetW, (h - 2 * margin) / sheetH);
  const ox = (w - sheetW * scale) / 2;
  const oy = (h - sheetH * scale) / 2;

  function tx(v) { return ox + v[0] * scale; }
  function ty(v) { return oy + (sheetH - v[1]) * scale; }

  // Draw edges
  const edges = ps.edges_vertices || [];
  const assignments = ps.edges_assignment || [];
  const order = ['F', 'U', 'V', 'M', 'B'];
  for (const asgn of order) {
    for (let i = 0; i < edges.length; i++) {
      if ((assignments[i] || 'U') !== asgn) continue;
      const [v1, v2] = edges[i];
      const p1 = coords2d[v1];
      const p2 = coords2d[v2];
      if (!p1 || !p2) continue;
      ctx.beginPath();
      ctx.moveTo(tx(p1), ty(p1));
      ctx.lineTo(tx(p2), ty(p2));
      ctx.strokeStyle = EDGE_COLORS[asgn] || EDGE_COLORS.U;
      ctx.lineWidth = EDGE_WIDTHS[asgn] || 1;
      if (asgn === 'M') ctx.setLineDash([8, 3, 2, 3]);
      else if (asgn === 'V') ctx.setLineDash([6, 3]);
      else ctx.setLineDash([]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // Draw vertices
  ctx.fillStyle = '#9ca3af';
  for (const v of coords2d) {
    if (!v) continue;
    ctx.beginPath();
    ctx.arc(tx(v), ty(v), 1.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Legend
  ctx.font = '11px -apple-system, BlinkMacSystemFont, sans-serif';
  let ly = 20;
  for (const [label, color, dash] of [['Mountain', '#dc2626', [8,3,2,3]], ['Valley', '#3b82f6', [6,3]], ['Boundary', '#374151', []]]) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.setLineDash(dash);
    ctx.beginPath();
    ctx.moveTo(w - 110, ly - 4);
    ctx.lineTo(w - 88, ly - 4);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#6b7280';
    ctx.fillText(label, w - 82, ly);
    ly += 18;
  }
}

// ── 3D Mesh Update ─────────────────────────────────────────
function updateMesh(ps) {
  if (!ps || !ps.vertices_coords) return;

  // Clear old mesh
  while (meshGroup.children.length) {
    const c = meshGroup.children[0];
    if (c.geometry) c.geometry.dispose();
    if (c.material) c.material.dispose();
    meshGroup.remove(c);
  }

  const verts = ps.vertices_coords;
  const faces = ps.faces_vertices || [];
  const strain = ps.strain_per_vertex || new Array(verts.length).fill(0);
  const edges = ps.edges_vertices || [];
  const assignments = ps.edges_assignment || [];

  // Use triangulated_faces from server if available, otherwise fan-triangulate
  let indices;
  if (ps.triangulated_faces && ps.triangulated_faces.length > 0) {
    indices = ps.triangulated_faces.flat();
  } else {
    indices = [];
    for (const face of faces) {
      for (let i = 1; i < face.length - 1; i++) {
        indices.push(face[0], face[i], face[i + 1]);
      }
    }
  }

  // Positions
  const positions = new Float32Array(verts.length * 3);
  for (let i = 0; i < verts.length; i++) {
    positions[i * 3] = verts[i][0];
    positions[i * 3 + 1] = verts[i][2] || 0;
    positions[i * 3 + 2] = -(verts[i][1] || 0);
  }

  // Strain -> vertex colors (light blue=0 -> red=max)
  const maxStrain = Math.max(...strain, 0.0001);
  const colors = new Float32Array(verts.length * 3);
  for (let i = 0; i < verts.length; i++) {
    const t = Math.min(strain[i] / maxStrain, 1.0);
    colors[i * 3]     = 0.85 + 0.15 * t;   // R
    colors[i * 3 + 1] = 0.88 - 0.52 * t;   // G
    colors[i * 3 + 2] = 0.95 - 0.82 * t;   // B
  }

  // Build geometry
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  if (indices.length > 0) {
    geometry.setIndex(indices);
  }
  geometry.computeVertexNormals();

  const material = new THREE.MeshStandardMaterial({
    vertexColors: true,
    side: THREE.DoubleSide,
    roughness: 0.65,
    metalness: 0.05,
    flatShading: false,
  });

  const mesh = new THREE.Mesh(geometry, material);
  meshGroup.add(mesh);

  // Draw crease edges
  const edgeColors = { M: 0xdc2626, V: 0x3b82f6, B: 0x6b7280 };
  for (let i = 0; i < edges.length; i++) {
    const asgn = assignments[i];
    if (!(asgn in edgeColors)) continue;
    const [v1, v2] = edges[i];
    const pts = [
      new THREE.Vector3(verts[v1][0], verts[v1][2] || 0, -(verts[v1][1] || 0)),
      new THREE.Vector3(verts[v2][0], verts[v2][2] || 0, -(verts[v2][1] || 0)),
    ];
    const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
    const lineMat = new THREE.LineBasicMaterial({
      color: edgeColors[asgn],
      linewidth: asgn === 'B' ? 2 : 1,
    });
    meshGroup.add(new THREE.Line(lineGeo, lineMat));
  }
}

// ── Metrics Dashboard ──────────────────────────────────────
function updateMetrics(obs) {
  const bar = document.getElementById('metrics-bar');
  const m = obs.metrics || {};
  const items = [
    { label: 'Compactness', value: (m.compactness || 0).toFixed(3), cls: m.compactness > 0.5 ? 'good' : '' },
    { label: 'Max Strain', value: (m.max_strain || 0).toFixed(5), cls: m.strain_exceeded ? 'bad' : '' },
    { label: 'Fold Count', value: m.fold_count || 0, cls: '' },
    { label: 'Valid', value: m.is_valid ? 'YES' : 'NO', cls: m.is_valid ? 'good' : 'bad' },
    { label: 'Kawasaki', value: m.kawasaki_violations || 0, cls: m.kawasaki_violations > 0 ? 'warn' : 'good' },
    { label: 'Maekawa', value: m.maekawa_violations || 0, cls: m.maekawa_violations > 0 ? 'warn' : 'good' },
    { label: 'Self-Int', value: m.self_intersections || 0, cls: m.self_intersections > 0 ? 'bad' : 'good' },
    { label: 'Energy', value: (m.total_energy || 0).toFixed(4), cls: '' },
  ];

  if (obs.done && obs.reward !== null && obs.reward !== undefined) {
    items.push({ label: 'Reward', value: obs.reward.toFixed(2), cls: obs.reward > 0 ? 'good' : 'bad' });
  }

  bar.innerHTML = items.map(i =>
    `<div class="metric-card"><div class="label">${i.label}</div><div class="value ${i.cls}">${i.value}</div></div>`
  ).join('');
}

// ── WebSocket ──────────────────────────────────────────────
function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${proto}//${location.host}/ws`;
  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    document.getElementById('status-label').textContent = 'Connected';
    document.getElementById('status-dot').classList.add('connected');
  };

  ws.onclose = () => {
    document.getElementById('status-label').textContent = 'Disconnected';
    document.getElementById('status-dot').classList.remove('connected');
    setTimeout(connect, 2000);
  };

  ws.onerror = () => {
    document.getElementById('status-label').textContent = 'Error';
    document.getElementById('status-dot').classList.remove('connected');
  };

  ws.onmessage = (evt) => {
    try {
      const msg = JSON.parse(evt.data);
      if (msg.type === 'observation' || msg.data) {
        const data = msg.data || msg;
        const obs = {
          done: data.done,
          reward: data.reward,
          ...(data.observation || {}),
        };
        currentObs = obs;
        handleObservation(obs);
      } else if (msg.type === 'state') {
        // State response — not used for rendering
      } else if (msg.type === 'error') {
        showError(msg.message || msg.error || 'Unknown error');
      }
    } catch (e) {
      console.error('WS parse error:', e);
    }
  };
}

function handleObservation(obs) {
  hideError();
  if (obs.error) showError(obs.error);

  drawCreasePattern(obs.paper_state);
  updateMesh(obs.paper_state);
  updateMetrics(obs);

  if (obs.done) {
    const bar = document.getElementById('error-bar');
    bar.textContent = `Episode ended. Reward: ${obs.reward !== null ? obs.reward.toFixed(2) : 'N/A'}`;
    bar.style.display = 'block';
    bar.className = obs.reward > 0 ? 'success' : '';
    bar.id = 'error-bar';
  }
}

function showError(msg) {
  const bar = document.getElementById('error-bar');
  bar.textContent = msg;
  bar.style.display = 'block';
  bar.className = '';
}

function hideError() {
  const bar = document.getElementById('error-bar');
  bar.style.display = 'none';
  bar.className = '';
}

// ── Controls ───────────────────────────────────────────────

// Reset
document.getElementById('btn-reset').addEventListener('click', () => {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const taskName = document.getElementById('task-select').value;
  ws.send(JSON.stringify({ type: 'reset', task_name: taskName }));
});

// Fold step
document.getElementById('btn-step').addEventListener('click', () => {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({
    type: 'step',
    action: {
      fold_type: document.getElementById('fold-type').value,
      fold_line: {
        start: [parseFloat(document.getElementById('lx1').value), parseFloat(document.getElementById('ly1').value)],
        end: [parseFloat(document.getElementById('lx2').value), parseFloat(document.getElementById('ly2').value)],
      },
      fold_angle: parseFloat(document.getElementById('fold-angle').value),
      layer_select: 'all',
    },
  }));
});

// Stop
document.getElementById('btn-stop').addEventListener('click', () => {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({
    type: 'step',
    action: {
      fold_type: 'stop',
      fold_line: { start: [0, 0], end: [0, 0] },
      fold_angle: 0,
      layer_select: 'all',
    },
  }));
});

// Fold % slider
const foldPctSlider = document.getElementById('fold-pct');
const foldPctVal = document.getElementById('fold-pct-val');
foldPctSlider.addEventListener('input', () => {
  foldPctVal.textContent = foldPctSlider.value + '%';
});

// Load SVG file
document.getElementById('btn-load-svg').addEventListener('click', () => {
  document.getElementById('file-svg').click();
});

document.getElementById('file-svg').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const content = await file.text();
  try {
    const resp = await fetch('/load_pattern', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ format: 'svg', content }),
    });
    const data = await resp.json();
    if (data.observation) {
      currentObs = data.observation;
      handleObservation(data.observation);
    } else if (data.error) {
      showError(data.error);
    }
  } catch (err) {
    showError('Failed to load SVG: ' + err.message);
  }
  e.target.value = '';
});

// Examples dropdown
const exBtn = document.getElementById('btn-examples');
const exDropdown = document.getElementById('examples-dropdown');
let examplesFetched = false;

exBtn.addEventListener('click', async () => {
  const isOpen = exDropdown.classList.contains('open');
  if (isOpen) {
    exDropdown.classList.remove('open');
    return;
  }

  if (!examplesFetched) {
    exDropdown.innerHTML = '<div class="empty-msg">Loading...</div>';
    exDropdown.classList.add('open');
    try {
      const resp = await fetch('/examples');
      const data = await resp.json();
      const items = data.examples || data || [];
      if (items.length === 0) {
        exDropdown.innerHTML = '<div class="empty-msg">No examples found</div>';
      } else {
        exDropdown.innerHTML = items.map(name =>
          `<button class="example-item" data-name="${name}">${name}</button>`
        ).join('');
        exDropdown.querySelectorAll('.example-item').forEach(btn => {
          btn.addEventListener('click', async (ev) => {
            ev.stopPropagation();
            exDropdown.classList.remove('open');
            try {
              const resp = await fetch('/load_pattern', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ example: btn.dataset.name }),
              });
              const d = await resp.json();
              if (d.observation) {
                currentObs = d.observation;
                handleObservation(d.observation);
              } else if (d.error) {
                showError(d.error);
              }
            } catch (err) {
              showError('Failed to load example: ' + err.message);
            }
          });
        });
      }
      examplesFetched = true;
    } catch (err) {
      exDropdown.innerHTML = '<div class="empty-msg">Could not fetch examples</div>';
    }
  } else {
    exDropdown.classList.add('open');
  }
});

// Close dropdown on click outside
document.addEventListener('click', (e) => {
  if (!exBtn.contains(e.target) && !exDropdown.contains(e.target)) {
    exDropdown.classList.remove('open');
  }
});

connect();
