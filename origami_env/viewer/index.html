<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Origami RL — Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; }

.app { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr auto auto; height: 100vh; gap: 2px; }

header { grid-column: 1 / -1; background: #16213e; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; }
header h1 { font-size: 18px; font-weight: 600; color: #e94560; }
header .status { font-size: 12px; color: #888; }
header .status.connected { color: #4ade80; }

.panel { background: #16213e; border-radius: 4px; overflow: hidden; position: relative; }
.panel-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #888; padding: 8px 12px; background: #0f3460; }

#crease-panel { min-height: 300px; }
#crease-canvas { width: 100%; height: calc(100% - 30px); }

#three-panel { min-height: 300px; }
#three-container { width: 100%; height: calc(100% - 30px); }

.controls { grid-column: 1 / -1; background: #16213e; padding: 10px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.controls label { font-size: 11px; color: #888; margin-right: 4px; }
.controls select, .controls input, .controls button {
  background: #0f3460; border: 1px solid #333; color: #e0e0e0; padding: 5px 10px;
  border-radius: 3px; font-size: 12px;
}
.controls button { cursor: pointer; background: #e94560; border: none; font-weight: 600; }
.controls button:hover { background: #c73e54; }
.controls button.secondary { background: #0f3460; border: 1px solid #444; }
.controls .spacer { flex: 1; }

.metrics { grid-column: 1 / -1; background: #16213e; padding: 10px 16px; display: flex; gap: 12px; flex-wrap: wrap; }
.metric-card { background: #0f3460; border-radius: 4px; padding: 8px 14px; min-width: 120px; }
.metric-card .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #888; }
.metric-card .value { font-size: 18px; font-weight: 700; color: #e0e0e0; margin-top: 2px; }
.metric-card .value.good { color: #4ade80; }
.metric-card .value.bad { color: #e94560; }
.metric-card .value.warn { color: #fbbf24; }

#error-bar { grid-column: 1 / -1; background: #e94560; color: white; padding: 8px 16px; font-size: 12px; display: none; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>ORIGAMI RL ENVIRONMENT</h1>
    <span id="status" class="status">Disconnected</span>
  </header>

  <div id="error-bar"></div>

  <div class="panel" id="crease-panel">
    <div class="panel-title">Crease Pattern (2D)</div>
    <canvas id="crease-canvas"></canvas>
  </div>

  <div class="panel" id="three-panel">
    <div class="panel-title">Folded State (3D)</div>
    <div id="three-container"></div>
  </div>

  <div class="controls">
    <label>Task</label>
    <select id="task-select">
      <option value="half_fold">half_fold</option>
      <option value="quarter_fold">quarter_fold</option>
      <option value="letter_fold">letter_fold</option>
      <option value="map_fold">map_fold</option>
      <option value="solar_panel">solar_panel</option>
      <option value="shelter_wall">shelter_wall</option>
      <option value="stent">stent</option>
    </select>

    <button id="btn-reset">Reset</button>

    <div class="spacer"></div>

    <label>Type</label>
    <select id="fold-type">
      <option value="valley">Valley</option>
      <option value="mountain">Mountain</option>
    </select>

    <label>Line X1</label><input id="lx1" type="number" value="0" min="0" max="1" step="0.1" style="width:55px">
    <label>Y1</label><input id="ly1" type="number" value="0.5" min="0" max="1" step="0.1" style="width:55px">
    <label>X2</label><input id="lx2" type="number" value="1" min="0" max="1" step="0.1" style="width:55px">
    <label>Y2</label><input id="ly2" type="number" value="0.5" min="0" max="1" step="0.1" style="width:55px">

    <label>Angle</label><input id="fold-angle" type="number" value="180" min="0" max="180" step="10" style="width:55px">

    <button id="btn-step">Fold</button>
    <button id="btn-stop" class="secondary">Stop (End)</button>
  </div>

  <div class="metrics" id="metrics-bar"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── State ──────────────────────────────────────────────────
let ws = null;
let currentObs = null;

// ── Three.js setup ─────────────────────────────────────────
const container = document.getElementById('three-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 100);
camera.position.set(0.5, 1.5, 2.0);

const renderer3d = new THREE.WebGLRenderer({ antialias: true });
container.appendChild(renderer3d.domElement);

const controls = new OrbitControls(camera, renderer3d.domElement);
controls.target.set(0.5, 0.5, 0);
controls.enableDamping = true;

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(2, 3, 2);
scene.add(dirLight);

// Mesh group
let meshGroup = new THREE.Group();
scene.add(meshGroup);

function resizeThree() {
  const w = container.clientWidth;
  const h = container.clientHeight;
  if (w === 0 || h === 0) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer3d.setSize(w, h);
  renderer3d.setPixelRatio(window.devicePixelRatio);
}
window.addEventListener('resize', resizeThree);
setTimeout(resizeThree, 100);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer3d.render(scene, camera);
}
animate();

// ── 2D Crease Canvas ───────────────────────────────────────
const creaseCanvas = document.getElementById('crease-canvas');
const ctx = creaseCanvas.getContext('2d');

function resizeCrease() {
  const panel = document.getElementById('crease-panel');
  creaseCanvas.width = panel.clientWidth;
  creaseCanvas.height = panel.clientHeight - 30;
  if (currentObs) drawCreasePattern(currentObs.paper_state);
}
window.addEventListener('resize', resizeCrease);
setTimeout(resizeCrease, 100);

const EDGE_COLORS = { M: '#e74c3c', V: '#3498db', B: '#e0e0e0', F: '#444', U: '#666' };
const EDGE_WIDTHS = { M: 2.5, V: 2.5, B: 3, F: 0.5, U: 1 };

function drawCreasePattern(ps) {
  if (!ps || !ps.vertices_coords) return;
  const w = creaseCanvas.width;
  const h = creaseCanvas.height;
  ctx.clearRect(0, 0, w, h);

  const verts = ps.vertices_coords;
  const sheetW = ps.width || 1;
  const sheetH = ps.height || 1;
  const margin = 40;
  const scale = Math.min((w - 2 * margin) / sheetW, (h - 2 * margin) / sheetH);
  const ox = (w - sheetW * scale) / 2;
  const oy = (h - sheetH * scale) / 2;

  function tx(v) { return ox + v[0] * scale; }
  function ty(v) { return oy + (sheetH - v[1]) * scale; }

  // Use rest_positions if available for 2D, otherwise vertices_coords
  const coords2d = verts;

  // Draw edges
  const edges = ps.edges_vertices || [];
  const assignments = ps.edges_assignment || [];
  // Draw F edges first, then M/V/B on top
  const order = ['F', 'U', 'V', 'M', 'B'];
  for (const asgn of order) {
    for (let i = 0; i < edges.length; i++) {
      if ((assignments[i] || 'U') !== asgn) continue;
      const [v1, v2] = edges[i];
      const p1 = coords2d[v1];
      const p2 = coords2d[v2];
      ctx.beginPath();
      ctx.moveTo(tx(p1), ty(p1));
      ctx.lineTo(tx(p2), ty(p2));
      ctx.strokeStyle = EDGE_COLORS[asgn] || EDGE_COLORS.U;
      ctx.lineWidth = EDGE_WIDTHS[asgn] || 1;
      if (asgn === 'M') ctx.setLineDash([8, 3, 2, 3]);
      else if (asgn === 'V') ctx.setLineDash([6, 3]);
      else ctx.setLineDash([]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // Draw vertices
  for (const v of coords2d) {
    ctx.beginPath();
    ctx.arc(tx(v), ty(v), 2, 0, Math.PI * 2);
    ctx.fillStyle = '#888';
    ctx.fill();
  }

  // Legend
  ctx.font = '11px sans-serif';
  let ly = 20;
  for (const [label, color] of [['Mountain', '#e74c3c'], ['Valley', '#3498db'], ['Boundary', '#e0e0e0']]) {
    ctx.fillStyle = color;
    ctx.fillRect(w - 100, ly - 8, 16, 3);
    ctx.fillStyle = '#888';
    ctx.fillText(label, w - 80, ly);
    ly += 16;
  }
}

// ── 3D Mesh Update ─────────────────────────────────────────
function updateMesh(ps) {
  if (!ps || !ps.vertices_coords) return;

  // Clear old mesh
  while (meshGroup.children.length) meshGroup.remove(meshGroup.children[0]);

  const verts = ps.vertices_coords;
  const faces = ps.faces_vertices || [];
  const strain = ps.strain_per_vertex || new Array(verts.length).fill(0);
  const edges = ps.edges_vertices || [];
  const assignments = ps.edges_assignment || [];

  // Triangulate faces and build index buffer
  const indices = [];
  for (const face of faces) {
    for (let i = 1; i < face.length - 1; i++) {
      indices.push(face[0], face[i], face[i + 1]);
    }
  }

  // Positions
  const positions = new Float32Array(verts.length * 3);
  for (let i = 0; i < verts.length; i++) {
    positions[i * 3] = verts[i][0];
    positions[i * 3 + 1] = verts[i][2]; // Z up → Y up for Three.js
    positions[i * 3 + 2] = -verts[i][1]; // Y → -Z
  }

  // Strain → vertex colors (blue=0 → red=max)
  const maxStrain = Math.max(...strain, 0.0001);
  const colors = new Float32Array(verts.length * 3);
  for (let i = 0; i < verts.length; i++) {
    const t = Math.min(strain[i] / maxStrain, 1.0);
    colors[i * 3] = 0.2 + 0.8 * t;       // R
    colors[i * 3 + 1] = 0.4 * (1 - t);   // G
    colors[i * 3 + 2] = 0.9 * (1 - t);   // B
  }

  // Build geometry
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  if (indices.length > 0) {
    geometry.setIndex(indices);
  }
  geometry.computeVertexNormals();

  const material = new THREE.MeshStandardMaterial({
    vertexColors: true,
    side: THREE.DoubleSide,
    roughness: 0.7,
    metalness: 0.1,
    flatShading: false,
  });

  const mesh = new THREE.Mesh(geometry, material);
  meshGroup.add(mesh);

  // Draw crease edges
  const edgeColors = { M: 0xe74c3c, V: 0x3498db, B: 0xaaaaaa };
  for (let i = 0; i < edges.length; i++) {
    const asgn = assignments[i];
    if (!(asgn in edgeColors)) continue;
    const [v1, v2] = edges[i];
    const pts = [
      new THREE.Vector3(verts[v1][0], verts[v1][2], -verts[v1][1]),
      new THREE.Vector3(verts[v2][0], verts[v2][2], -verts[v2][1]),
    ];
    const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
    const lineMat = new THREE.LineBasicMaterial({
      color: edgeColors[asgn],
      linewidth: asgn === 'B' ? 2 : 1,
    });
    meshGroup.add(new THREE.Line(lineGeo, lineMat));
  }
}

// ── Metrics Dashboard ──────────────────────────────────────
function updateMetrics(obs) {
  const bar = document.getElementById('metrics-bar');
  const m = obs.metrics || {};
  const items = [
    { label: 'Compactness', value: (m.compactness || 0).toFixed(3), cls: m.compactness > 0.5 ? 'good' : '' },
    { label: 'Max Strain', value: (m.max_strain || 0).toFixed(5), cls: m.strain_exceeded ? 'bad' : '' },
    { label: 'Fold Count', value: m.fold_count || 0, cls: '' },
    { label: 'Valid', value: m.is_valid ? 'YES' : 'NO', cls: m.is_valid ? 'good' : 'bad' },
    { label: 'Kawasaki', value: m.kawasaki_violations || 0, cls: m.kawasaki_violations > 0 ? 'warn' : 'good' },
    { label: 'Maekawa', value: m.maekawa_violations || 0, cls: m.maekawa_violations > 0 ? 'warn' : 'good' },
    { label: 'Self-Int', value: m.self_intersections || 0, cls: m.self_intersections > 0 ? 'bad' : 'good' },
    { label: 'Energy', value: (m.total_energy || 0).toFixed(4), cls: '' },
  ];

  if (obs.done && obs.reward !== null && obs.reward !== undefined) {
    items.push({ label: 'Reward', value: obs.reward.toFixed(2), cls: obs.reward > 0 ? 'good' : 'bad' });
  }

  bar.innerHTML = items.map(i =>
    `<div class="metric-card"><div class="label">${i.label}</div><div class="value ${i.cls}">${i.value}</div></div>`
  ).join('');
}

// ── WebSocket ──────────────────────────────────────────────
function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  // Connect to /ws on the same host (OpenEnv WebSocket)
  const wsUrl = `${proto}//${location.host}/ws`;
  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    document.getElementById('status').textContent = 'Connected';
    document.getElementById('status').className = 'status connected';
  };

  ws.onclose = () => {
    document.getElementById('status').textContent = 'Disconnected';
    document.getElementById('status').className = 'status';
    setTimeout(connect, 2000);
  };

  ws.onerror = () => {
    document.getElementById('status').textContent = 'Error';
    document.getElementById('status').className = 'status';
  };

  ws.onmessage = (evt) => {
    try {
      const msg = JSON.parse(evt.data);
      if (msg.type === 'observation' || msg.data) {
        const data = msg.data || msg;
        const obs = {
          done: data.done,
          reward: data.reward,
          ...(data.observation || {}),
        };
        currentObs = obs;
        handleObservation(obs);
      } else if (msg.type === 'state') {
        // State response — not used for rendering
      } else if (msg.type === 'error') {
        showError(msg.message || msg.error || 'Unknown error');
      }
    } catch (e) {
      console.error('WS parse error:', e);
    }
  };
}

function handleObservation(obs) {
  hideError();
  if (obs.error) showError(obs.error);

  drawCreasePattern(obs.paper_state);
  updateMesh(obs.paper_state);
  updateMetrics(obs);

  if (obs.done) {
    showError(`Episode ended. Reward: ${obs.reward !== null ? obs.reward.toFixed(2) : 'N/A'}`);
    document.getElementById('error-bar').style.background = obs.reward > 0 ? '#4ade80' : '#e94560';
  }
}

function showError(msg) {
  const bar = document.getElementById('error-bar');
  bar.textContent = msg;
  bar.style.display = 'block';
}

function hideError() {
  document.getElementById('error-bar').style.display = 'none';
  document.getElementById('error-bar').style.background = '#e94560';
}

// ── Controls ───────────────────────────────────────────────
document.getElementById('btn-reset').addEventListener('click', () => {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const taskName = document.getElementById('task-select').value;
  ws.send(JSON.stringify({ type: 'reset', task_name: taskName }));
});

document.getElementById('btn-step').addEventListener('click', () => {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({
    type: 'step',
    action: {
      fold_type: document.getElementById('fold-type').value,
      fold_line: {
        start: [parseFloat(document.getElementById('lx1').value), parseFloat(document.getElementById('ly1').value)],
        end: [parseFloat(document.getElementById('lx2').value), parseFloat(document.getElementById('ly2').value)],
      },
      fold_angle: parseFloat(document.getElementById('fold-angle').value),
      layer_select: 'all',
    },
  }));
});

document.getElementById('btn-stop').addEventListener('click', () => {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({
    type: 'step',
    action: {
      fold_type: 'stop',
      fold_line: { start: [0, 0], end: [0, 0] },
      fold_angle: 0,
      layer_select: 'all',
    },
  }));
});

// ── Init ───────────────────────────────────────────────────
connect();
</script>
</body>
</html>
