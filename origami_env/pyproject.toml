[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "origami-env"
version = "0.1.0"
description = "OpenEnv-compatible origami folding RL environment"
requires-python = ">=3.10"
dependencies = [
    "openenv-core>=0.2.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.0",
    "matplotlib>=3.7",
    "imageio>=2.31",
    "Pillow>=10.0",
    "fastapi>=0.100",
    "uvicorn>=0.22",
    "websockets>=11.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.24",
]

[tool.setuptools.packages.find]
include = ["origami_env*"]
